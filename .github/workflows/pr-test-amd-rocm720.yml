name: PR Test (AMD ROCm 7.2)

on:
  # pull_request trigger intentionally disabled until the AMD runner fleet is
  # confirmed and stage-c-*-mi35x has registered tests. Enable then.
  # pull_request:
  #   types: [synchronize, labeled]
  workflow_dispatch:
    inputs:
      infinite_run:
        description: 'Run training infinitely'
        required: false
        type: boolean
        default: false
      ci_megatron_pr:
        description: 'Megatron-LM branch/commit (default: miles-main)'
        required: false
        type: string
        default: 'miles-main'
      ci_sglang_pr:
        description: 'SGLang branch/commit (default: sglang-miles)'
        required: false
        type: string
        default: 'sglang-miles'
      ci_image_tag:
        description: 'Miles ROCm image tag (default: dev-rocm720-mi35x)'
        required: false
        type: string
        default: 'dev-rocm720-mi35x'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-ci-image:
    if: (github.event_name == 'workflow_dispatch') || (github.event.pull_request)
    runs-on: ubuntu-latest
    outputs:
      container_image: ${{ steps.resolve.outputs.container_image }}
    steps:
      - name: Resolve CI image
        id: resolve
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          INPUT_CI_IMAGE_TAG: ${{ github.event.inputs.ci_image_tag || '' }}
        run: |
          CI_IMAGE_TAG="${INPUT_CI_IMAGE_TAG}"
          if [ -n "$PR_BODY" ]; then
            PR_CI_IMAGE_TAG=$(echo "$PR_BODY" | grep -m1 -oP '^ci-image-tag:\s+\K\S+' || true)
            [ -z "$CI_IMAGE_TAG" ] && [ -n "$PR_CI_IMAGE_TAG" ] && CI_IMAGE_TAG="$PR_CI_IMAGE_TAG"
          fi
          [ -z "$CI_IMAGE_TAG" ] && CI_IMAGE_TAG="dev-rocm720-mi35x"
          if [[ ! "$CI_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::ci-image-tag must be a Docker tag, not a full image name: $CI_IMAGE_TAG"
            exit 1
          fi
          echo "container_image=rlsys/miles:${CI_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved CI image: rlsys/miles:${CI_IMAGE_TAG}"

  # ROCm 7.2 / gfx950 (MI350-355) lanes, mirroring the NV c-2 / c-4 / c-8 tiers.
  # TODO: confirm AMD runner labels with the fleet owner. On a single 8-card node
  # the 2/4/8-gpu runners cannot be live simultaneously (cards overlap); provision
  # non-overlapping slices or separate nodes, or run the lanes at different times.
  stage-b-2-gpu-mi35x:
    needs: [resolve-ci-image]
    if: (github.event_name == 'workflow_dispatch') || (github.event.pull_request)
    uses: ./.github/workflows/_run-ci.yml
    with:
      hw: amd
      runs_on: '["mi35x", "2gpu"]'
      container_image: ${{ needs.resolve-ci-image.outputs.container_image }}
      execute_command: >-
        python tests/ci/run_suite.py --hw amd --suite stage-b-2-gpu-mi35x
        --labels ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci-image') || contains(github.event.pull_request.labels.*.name, 'run-ci-all')) && '--match-all-labels' || '' }}
    secrets: inherit

  stage-c-2-gpu-mi35x:
    needs: [resolve-ci-image]
    if: (github.event_name == 'workflow_dispatch') || (github.event.pull_request)
    uses: ./.github/workflows/_run-ci.yml
    with:
      hw: amd
      runs_on: '["mi35x", "2gpu"]'
      container_image: ${{ needs.resolve-ci-image.outputs.container_image }}
      execute_command: >-
        python tests/ci/run_suite.py --hw amd --suite stage-c-2-gpu-mi35x
        --labels ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci-image') || contains(github.event.pull_request.labels.*.name, 'run-ci-all')) && '--match-all-labels' || '' }}
    secrets: inherit

  stage-c-4-gpu-mi35x:
    needs: [resolve-ci-image]
    if: (github.event_name == 'workflow_dispatch') || (github.event.pull_request)
    uses: ./.github/workflows/_run-ci.yml
    with:
      hw: amd
      runs_on: '["mi35x", "4gpu"]'
      container_image: ${{ needs.resolve-ci-image.outputs.container_image }}
      execute_command: >-
        python tests/ci/run_suite.py --hw amd --suite stage-c-4-gpu-mi35x
        --labels ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci-image') || contains(github.event.pull_request.labels.*.name, 'run-ci-all')) && '--match-all-labels' || '' }}
    secrets: inherit

  stage-c-8-gpu-mi35x:
    needs: [resolve-ci-image]
    if: (github.event_name == 'workflow_dispatch') || (github.event.pull_request)
    uses: ./.github/workflows/_run-ci.yml
    with:
      hw: amd
      runs_on: '["mi35x", "8gpu"]'
      container_image: ${{ needs.resolve-ci-image.outputs.container_image }}
      execute_command: >-
        python tests/ci/run_suite.py --hw amd --suite stage-c-8-gpu-mi35x
        --labels ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci-image') || contains(github.event.pull_request.labels.*.name, 'run-ci-all')) && '--match-all-labels' || '' }}
    secrets: inherit
